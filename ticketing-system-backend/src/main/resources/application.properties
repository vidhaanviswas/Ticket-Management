# Server Configuration - Use PORT from environment (Render sets this automatically)
server.port=${PORT:8081}

# Database Configuration - Use environment variables from Render PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ticketing_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration - Use environment variable
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-to-a-very-long-random-string}
jwt.expiration=86400000

# CORS Configuration - Use environment variable for frontend URL
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Attachment storage (Note: Consider using cloud storage as Render filesystem is ephemeral)
app.attachments.storage-path=${STORAGE_PATH:uploads}
app.attachments.max-bytes=10485760
app.attachments.allowed-content-types=image/png,image/jpeg,image/webp,application/pdf
