services:
  - type: web
    name: ticketing-backend
    env: java
    buildCommand: cd ticketing-system-backend && mvn clean package -DskipTests
    startCommand: cd ticketing-system-backend && java -jar target/ticketing-system-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Note: Set FRONTEND_URL manually after frontend is deployed
      # Format: https://your-frontend-name.onrender.com
      - key: STORAGE_PATH
        value: /opt/render/project/src/uploads

  - type: web
    name: ticketing-frontend
    env: node
    buildCommand: cd ticketing-system-frontend && npm install && npm run build
    startCommand: cd ticketing-system-frontend && npm start
    envVars:
      # Note: Set NEXT_PUBLIC_API_URL manually after backend is deployed
      # Format: https://your-backend-name.onrender.com/api

databases:
  - name: ticketing-db
    databaseName: ticketing_system
    user: ticketing_user
