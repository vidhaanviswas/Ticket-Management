# NOTE: Render Blueprint (render.yaml) does NOT support Java/Spring Boot services
# You must configure the backend service MANUALLY in Render Dashboard
# 
# Backend Configuration (do this manually):
# 1. Go to Render Dashboard -> New Web Service
# 2. Connect your GitHub repository
# 3. Configure:
#    - Name: ticketing-backend
#    - Environment: Java (NOT Node or Auto-detect)
#    - Root Directory: ticketing-system-backend
#    - Build Command: mvn clean package -DskipTests
#    - Start Command: java -jar target/ticketing-system-1.0.0.jar
# 4. Add Environment Variables:
#    - DATABASE_URL (from PostgreSQL database)
#    - JWT_SECRET (generate a strong random string)
#    - FRONTEND_URL (set after frontend is deployed)
#    - STORAGE_PATH: /opt/render/project/src/uploads

services:
  # Frontend service - can be deployed via Blueprint
  - type: web
    name: ticketing-frontend
    runtime: node
    buildCommand: cd ticketing-system-frontend && npm install && npm run build
    startCommand: cd ticketing-system-frontend && npm start
    envVars:
      # Note: Set NEXT_PUBLIC_API_URL manually after backend is deployed
      # Format: https://your-backend-name.onrender.com/api

databases:
  - name: ticketing-db
    databaseName: ticketing_system
    user: ticketing_user
